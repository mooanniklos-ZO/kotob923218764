name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Prepare Environment & Keystores
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Prepare .env file
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          fi

          # 2. Decode Debug Keystore if base64 file exists
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "${{ github.workspace }}/debug.keystore" || true
          fi

          # 3. Decode Release Keystore from GitHub Secret
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "Release Keystore decoded successfully."
          else
            echo "KEYSTORE_PATH=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret provided, using fallback."
          fi

      - name: Build Android Release APK & AAB Bundle
        env:
          STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Publish GitHub Release with APK & AAB
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "إصدار تطبيق إستكفي مما تزرع v1.0.${{ github.run_number }}"
          body: |
            ## 🌿 تطبيق كتاب «إستكفي مما تزرع» - للدكتور مالك عبدالرحمن الرميمة
            تم بناء التطبيق وتوقيعه بنجاح عبر GitHub Actions.
            
            ### 📥 روابط التحميل المباشرة:
            - **تطبيق الأندرويد (Release APK)**: جاهز للتثبيت الفوري على هاتفك.
            - **حزمة النشر (AAB Bundle)**: جاهزة للنشر على متجر Google Play.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
