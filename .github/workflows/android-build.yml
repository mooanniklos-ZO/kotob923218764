name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Environment & Real Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 GitHub Secret is missing."
            echo "A real release APK will never be produced with the debug keystore."
            exit 1
          }

          test -n "${{ secrets.CM_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}" || {
            echo "ERROR: release keystore password secret is missing."
            exit 1
          }
          test -n "${{ secrets.CM_KEY_ALIAS || secrets.KEY_ALIAS }}" || {
            echo "ERROR: release key alias secret is missing."
            exit 1
          }
          test -n "${{ secrets.CM_KEY_PASSWORD || secrets.KEY_PASSWORD }}" || {
            echo "ERROR: release key password secret is missing."
            exit 1
          }

          : > .env
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "${{ github.workspace }}/release.keystore"
          test -s "${{ github.workspace }}/release.keystore"
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
          echo "Real release keystore prepared successfully."

      - name: Build Android Release APK & AAB Bundle
        env:
          STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          # GitHub Secrets are sometimes pasted with a trailing CR/LF. Strip only
          # surrounding line breaks so the actual keystore credentials are exact.
          export STORE_PASSWORD="$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')"
          export KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          export KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          gradle clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify Real Release Outputs
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          echo "=== REAL RELEASE APK ==="
          ls -lh app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          echo "=== REAL RELEASE AAB ==="
          ls -lh app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with Real APK & AAB
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "إصدار تطبيق إستكفي مما تزرع v1.0.${{ github.run_number }}"
          body: |
            ## 🌿 تطبيق كتاب «إستكفي مما تزرع»

            تم بناء هذه النسخة من المصدر الحقيقي للمشروع وتوقيعها بمفتاح Release الحقيقي.

            ### 📥 التحميل
            - **Release APK:** التطبيق الحقيقي الجاهز للتثبيت على Android.
            - **Release AAB:** حزمة النشر الحقيقية لمتجر Google Play.

            لا يتم استخدام debug keystore في هذا الإصدار.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
